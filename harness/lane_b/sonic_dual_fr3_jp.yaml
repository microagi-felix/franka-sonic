# @package _global_
# sonic_dual_fr3 + a joint-space tracking reward and tighter tracking kernels.
# Canonical copy: franka-sonic/harness/lane_b/sonic_dual_fr3_jp.yaml
# Installed as:   ~/GR00T-WholeBodyControl/gear_sonic/config/exp/sonic_dual_fr3_jp.yaml
#
# Run lane_b/2026-09-03_sonic_rl-3 (plain sonic_dual_fr3) plateaued at joint error ~0.75 rad
# with body error 6 cm and body-rotation error 0.82 rad: the position kernels (std 0.3 m /
# 0.1 m) are saturated at that error and nothing rewards joint angles directly, so joints 1
# and 7 (whose axes pass through the tracked link origins) float. This variant:
#   * tracking_joint_pos (harness/lane_b/sonic_rewards.py, needs PYTHONPATH=harness/lane_b),
#     mounted on RewardsCfg's spare `tracking_relative_body_ori_weighted` slot
#   * sharper stds for relative body pos / ori and the flange points
defaults:
  - sonic_dual_fr3
  - _self_

manager_env:
  rewards:
    tracking_relative_body_pos:
      params:
        std: 0.1
    tracking_relative_body_ori:
      params:
        std: 0.25
    tracking_vr_5point_local:
      params:
        std: 0.05
    tracking_relative_body_ori_weighted:
      _target_: isaaclab.managers.RewardTermCfg
      func: sonic_rewards:tracking_joint_pos_error
      weight: 2.0
      params:
        command_name: "motion"
        std: 0.3
